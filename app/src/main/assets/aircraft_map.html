<body>
<div id="map"></div>
<canvas id="trafficCanvas"></canvas>
<div class="toolbar"><div class="tools"><button class="tool" data-i18n-title="map_menu" onclick="openSheet('menu')">☰</button><button class="tool" data-i18n-title="find" onclick="toggleSearch()">⌕</button></div></div>
<button id="locationButton" class="map-location" data-i18n-title="center_location" onclick="locateMe()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="search" class="search"><input id="searchText" data-i18n-placeholder="search_hint" placeholder="Callsign, registration, hex or type" oninput="searchChanged()" onkeydown="searchKeydown(event)"><span id="searchResult" class="search-result"></span><button class="apply" data-i18n="find" onclick="selectFirstMatch()">Find</button><div id="searchSuggestions" class="search-suggestions"></div></div>
<div id="empty" class="empty" data-i18n-title="waiting"><i class="spinner"></i></div><div id="zoomWarning" class="zoom-warning"></div>

<div id="menu" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="map_menu">Map menu</h1>
  <div class="row action" onclick="toggleFlag('follow',this)"><span>⌖</span><label data-i18n="follow_selected">Follow selected aircraft</label></div>
  <div class="section" data-i18n="filters">Filters</div>
  <div class="row action" onclick="toggleFilterMilitary(this)"><span>♢</span><label data-i18n="military_only">Military only</label></div>
  <div class="row action" onclick="toggleFlag('isolate',this);render()"><span>◉</span><label data-i18n="isolate_selected">Isolate selected aircraft</label></div>
  <div class="row action" onclick="openFilters()"><span>▽</span><label data-i18n="all_filters">All filter options…</label><b>›</b></div>
  <div class="section" data-i18n="tools">Tools</div>
  <div class="row action" onclick="toggleFlag('allTracks',this);render()"><span>⌘</span><label data-i18n="tracks_all">Show tracks for all aircraft</label></div>
  <div class="row action selected" onclick="toggleFlag('lastLeg',this);render()"><span>↥</span><label data-i18n="last_leg_only">Show last leg only</label></div>
  <div class="row action" onclick="toggleFlag('multiple',this)"><span>▣</span><label data-i18n="select_multiple">Select multiple aircraft</label></div>
  <div class="row action" onclick="randomAircraft();closePanels()"><span>↗</span><label data-i18n="random_aircraft">Follow a random aircraft</label></div>
  <div class="row action" onclick="showBookmarks()"><span>☆</span><label data-i18n="bookmarks">Bookmarks</label><b>›</b></div>
</div>

<div id="filters" class="filters"><button class="close" onclick="closePanels()">×</button><h2 data-i18n="aircraft_filters">Aircraft filters</h2>
  <div class="filter-row"><b data-i18n="type_code">Type code</b><input id="fType"></div><div class="filter-row"><b data-i18n="type_description">Type description</b><input id="fDesc"></div><div class="filter-row"><b data-i18n="hex_id">ICAO hex id</b><input id="fHex"></div>
  <div class="filter-row"><b data-i18n="source">Source</b><div class="chips" id="sourceChips"></div></div><div class="filter-row"><b data-i18n="db_flags">Database flags</b><div class="chips" id="flagChips"></div></div>
  <div class="filter-row"><b data-i18n="registration">Registration</b><input id="fReg"></div><div class="filter-row"><b data-i18n="country_prefix">Country / registration prefix</b><input id="fCountry"></div><div class="filter-row"><b data-i18n="category">Category (A3, B0, …)</b><input id="fCategory"></div>
  <button class="apply" data-i18n="apply_filters" onclick="applyFilters()">Apply filters</button><button class="reset" data-i18n="clear_filters" onclick="clearFilters()">Clear all filters</button>
</div>
<div id="bookmarks" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="bookmarks">Bookmarks</h1><div id="bookmarkList"></div></div>
<div id="info" class="info"></div>

  function rememberAircraftBatch(batch,now,prune){supplementBatchMetadata(batch);cachePositionSnapshots(batch,now);batch.forEach(a=>{if(!a||!a.hex)return;known.delete(a.hex);known.set(a.hex,a)});while(known.size>2000)known.delete(known.keys().next().value);if(batch.length)updateHistory(batch,now,prune)}
  function finishAircraftUpdate(){pruneHistory(new Set(aircraft.map(a=>a.hex)));applyPendingFocus();const infoOpen=document.getElementById('info').classList.contains('open');if(infoOpen&&selected.size)showInfo([...selected].pop())}
  window.marConfigure=function(ownLat,ownLon,_radiusKm,nativeSettings){applyMapConfiguration(ownLat,ownLon,nativeSettings)};
  window.marBeginUpdate=function(revision,ownLat,ownLon,_radiusKm,nativeSettings,_aircraftCount){incomingRevision=Number(revision);incomingStarted=false;incomingChunkCount=0;incomingPreviousAircraft=aircraftMap(aircraft);incomingReceivedAircraft=new Map();applyMapConfiguration(ownLat,ownLon,nativeSettings)};
  window.marAppendUpdate=function(revision,batch,last){if(Number(revision)!==incomingRevision||!Array.isArray(batch))return;const now=Date.now();if(!incomingPreviousAircraft)incomingPreviousAircraft=aircraftMap(aircraft);if(!incomingReceivedAircraft)incomingReceivedAircraft=new Map();rememberAircraftBatch(batch,now,false);batch.forEach(a=>{if(!a||!a.hex)return;incomingReceivedAircraft.set(norm(a.hex).replace(/^~/,''),a)});incomingStarted=true;incomingChunkCount++;if(last){const nextMap=currentOrRetainedAircraft(incomingReceivedAircraft,incomingPreviousAircraft,now);aircraft=[...nextMap.values()];incomingPreviousAircraft=null;incomingReceivedAircraft=null;scheduleCanvas();finishAircraftUpdate()}};
  window.marUpdate=function(raw,ownLat,ownLon,_radiusKm,nativeSettings){applyMapConfiguration(ownLat,ownLon,nativeSettings);let fresh=[];try{fresh=Array.isArray(raw)?raw:(JSON.parse(raw)||[])}catch(e){}const now=Date.now(),previous=aircraftMap(aircraft);supplementBatchMetadata(fresh);cachePositionSnapshots(fresh,now);fresh.forEach(a=>{known.delete(a.hex);known.set(a.hex,a)});while(known.size>2000)known.delete(known.keys().next().value);if(fresh.length)updateHistory(fresh,now);aircraft=[...currentOrRetainedAircraft(aircraftMap(fresh),previous,now).values()];render();finishAircraftUpdate()};
  let viewportTimer=0;function reportViewport(){clearTimeout(viewportTimer);viewportTimer=setTimeout(()=>{if(!window.MarNative||!MarNative.setMapViewport)return;const center=map.getCenter();MarNative.setMapViewport(center.lat,center.lng,requestedViewportRadiusNm(),map.getZoom())},180)}
  function transformPausedTraffic(){if(!trafficPaused||!trafficAnchorCenter||!trafficAnchorPoint)return;const scale=Math.pow(2,map.getZoom()-trafficAnchorZoom),current=map.latLngToContainerPoint(trafficAnchorCenter),x=current.x-scale*trafficAnchorPoint.x,y=current.y-scale*trafficAnchorPoint.y;trafficCanvas.style.transform='translate3d('+x+'px,'+y+'px,0) scale('+scale+')'}
  function beginMapPan(){if(mapZoomActive||trafficPaused)return;trafficPaused=true;if(canvasFrame){cancelAnimationFrame(canvasFrame);canvasFrame=0}trafficAnchorCenter=map.getCenter();trafficAnchorPoint=map.latLngToContainerPoint(trafficAnchorCenter);trafficAnchorZoom=map.getZoom();trafficCanvas.style.transformOrigin='0 0';trafficCanvas.style.opacity='1';transformPausedTraffic()}
  function endMapPan(){if(!trafficPaused)return;trafficPaused=false;trafficCanvas.style.transform='none';trafficAnchorCenter=null;trafficAnchorPoint=null;scheduleCanvas()}
  function beginMapZoom(){mapZoomActive=true;if(trafficPaused)endMapPan();trafficCanvas.style.transform='none';trafficCanvas.style.opacity='.22';scheduleCanvas()}
  function endMapZoom(){mapZoomActive=false;trafficCanvas.style.opacity='1';scheduleCanvas();reportViewport()}
  map.on('dragstart',beginMapPan);map.on('drag',transformPausedTraffic);map.on('dragend',()=>{endMapPan();reportViewport()});map.on('zoomstart',beginMapZoom);map.on('zoom',scheduleCanvas);map.on('zoomend',endMapZoom);map.on('move',()=>{if(mapZoomActive)scheduleCanvas()});map.on('moveend',()=>{if(!trafficPaused&&!mapZoomActive)reportViewport()});map.on('resize',scheduleCanvas);window.addEventListener('resize',()=>{window.marResize();reportViewport()});
  applyAppearance();window.marResize();
</script>
