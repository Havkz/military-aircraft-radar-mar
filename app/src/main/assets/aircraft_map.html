    button,.tool{border:0;color:#fff;background:transparent;font:inherit}.tool{width:34px;height:34px;border-radius:17px;font-size:18px;padding:0}.tool.active{background:#075dab;color:#fff}.tool:active{background:#26313a}.search{position:absolute;z-index:710;top:52px;left:8px;right:8px;background:#050709;border:1px solid var(--line);border-radius:12px;padding:8px;display:none;gap:6px;box-shadow:0 8px 24px #000a}.search.open{display:flex}.search input,.filters input{min-width:0;flex:1;background:#0d1318;border:1px solid #62707a;color:#fff;border-radius:8px;padding:9px;font:inherit}.search-suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);display:none;overflow:hidden;padding:5px;background:linear-gradient(155deg,rgba(8,17,21,.98),rgba(4,9,12,.98));border:1px solid #354d59;border-radius:14px;box-shadow:0 12px 32px #000d;transform-origin:top}.search-suggestions.open{display:block;animation:suggestionsIn .18s cubic-bezier(.2,.9,.2,1)}@keyframes suggestionsIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}.search-suggestion{display:grid;width:100%;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;padding:8px 9px;border-radius:10px;text-align:left;transition:background .12s,transform .12s}.search-suggestion:hover,.search-suggestion.active{background:#123143}.search-suggestion:active{transform:scale(.985)}.suggestion-icon{grid-row:1/3;align-self:center;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#123d50;color:#63d5ff;font-size:12px}.suggestion-title{overflow:hidden;color:#f4fbff;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.suggestion-meta{overflow:hidden;color:#8faab7;font-size:10px;text-overflow:ellipsis;white-space:nowrap}

-height:1.1;text-align:right;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}.identity-card{margin:10px 0 4px;padding:9px 11px;border:1px solid #1c4d70;border-radius:12px;background:linear-gradient(145deg,#0b2435,#09141d);box-shadow:inset 0 1px #ffffff0b}.info-section{margin-top:7px;border-top:1px solid #35424c}.info-section h4{margin:0;padding:8px 0 6px;color:#54baff;text-align:center;text-transform:uppercase;font-size:11px;letter-spacing:.13em}.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}.info-key,.info-value{padding:4px 0;border-bottom:1px solid #17212a}.info-key{color:#95a3ad}.info-value{color:#f4f8fa;text-align:right;font-weight:650;overflow-wrap:anywhere}.destination-list{display:grid;gap:7px}.destination-loading,.destination-empty{padding:11px;border:1px solid #243b49;border-radius:12px;background:#09141c;color:#9eb3bf;text-align:center;font-size:11px}.destination-loading:before{content:'';display:inline-block;width:9px;height:9px;margin-right:7px;border:2px solid #24506a;border-top-color:#62caff;border-radius:50%;vertical-align:-1px;animation:spin .75s linear infinite}.destination-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 10px;border:1px solid #1e4b65;border-radius:12px;background:linear-gradient(135deg,#0a2636,#09151d);box-shadow:inset 0 1px #ffffff0b}.destination-item b{overflow:hidden;color:#eefaff;text-overflow:ellipsis;white-space:nowrap}.destination-item b span{margin-left:5px;padding:2px 5px;border-radius:7px;background:#15557a;color:#8cd8ff;font-size:9px}.destination-item small{grid-column:1;color:#8faab8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.destination-item em{grid-column:2;grid-row:1/3;align-self:center;padding:4px 7px;border-radius:10px;background:#083c32;color:#72f1b8;font-size:10px;font-style:normal;font-weight:700}.destination-meta{padding:2px 3px;color:#748995;text-align:right;font-size:9px}.source{margin-top:8px;color:var(--blue)}.info a{color:#51b9ff}.extra-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.extra-links a{display:inline-block;padding:7px 10px;border:1px solid #285371;border-radius:12px;background:#0a1c28;text-decoration:none}.empty{position:absolute;z-index:680;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}.spinner{width:18px;height:18px;border:2px solid rgba(29,77,61,.28);border-top-color:#20df91;border-radius:50%;animation:spin .7s linear infinite;will-change:transform}@keyframes spin{to{transform:rotate(360deg)}}.zoom-warning{position:absolute;z-index:680;left:12px;right:12px;top:54px;padding:9px 12px;border-radius:10px;background:rgba(7,16,24,.91);text-align:center;pointer-events:none;display:none;color:#ffd27a;border:1px solid #a66b18;font-weight:700}.measure-note{position:absolute;z-index:720;top:54px;left:50%;transform:translateX(-50%);background:#050709;border-radius:10px;padding:7px 10px;display:none}.leaflet-control-attribution{font-size:8px!important;line-height:1.2!important;padding:1px 3px!important;background:rgba(0,0,0,.58)!important;color:#cbd2d6!important;border-radius:4px 0 0 0}.leaflet-control-attribution a{color:#8ed5ff!important}
    .info-head.photo-loaded{min-height:112px}.header-photo{-webkit-mask-image:none;mask-image:none}.header-photo a{-webkit-mask-image:linear-gradient(to left,#000 0,#000 55%,transparent 100%);mask-image:linear-gradient(to left,#000 0,#000 55%,transparent 100%)}.header-photo.fallback.loaded:after{content:'';position:absolute;inset:1px;border:1.5px solid #ff4055;border-radius:9px 0 0 9px;pointer-events:none;box-shadow:inset 0 0 8px #ff405533}.photo-warning{position:absolute;z-index:3;right:6px;bottom:16px;display:none;max-width:68%;padding:2px 5px;border-radius:8px;background:#35090ddb;color:#ffd3d7;font-size:7px;font-weight:700;line-height:1.1;white-space:nowrap}.header-photo.fallback.loaded .photo-warning{display:block}
  </style>

<body>
<div id="map"></div>
<canvas id="trafficCanvas"></canvas>
<div class="toolbar"><div class="tools"><button class="tool" data-i18n-title="map_menu" onclick="openSheet('menu')">☰</button><button class="tool" data-i18n-title="find" onclick="toggleSearch()">⌕</button></div></div>
<button id="locationButton" class="map-location" data-i18n-title="center_location" onclick="locateMe()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="search" class="search"><input id="searchText" data-i18n-placeholder="search_hint" placeholder="Callsign, registration, hex or type" oninput="searchChanged()" onkeydown="searchKeydown(event)"><span id="searchResult" class="search-result"></span><button class="apply" data-i18n="find" onclick="selectFirstMatch()">Find</button><div id="searchSuggestions" class="search-suggestions"></div></div>
<div id="empty" class="empty" data-i18n-title="waiting"><i class="spinner"></i></div><div id="zoomWarning" class="zoom-warning"></div>

<div id="menu" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="map_menu">Map menu</h1>
  <div class="row action" onclick="toggleFlag('follow',this)"><span>⌖</span><label data-i18n="follow_selected">Follow selected aircraft</label></div>
  <div class="section" data-i18n="filters">Filters</div>
  <div class="row action" onclick="toggleFilterMilitary(this)"><span>♢</span><label data-i18n="military_only">Military only</label></div>
  <div class="row action" onclick="toggleFlag('isolate',this);render()"><span>◉</span><label data-i18n="isolate_selected">Isolate selected aircraft</label></div>
  <div class="row action" onclick="openFilters()"><span>▽</span><label data-i18n="all_filters">All filter options…</label><b>›</b></div>
  <div class="section" data-i18n="tools">Tools</div>
  <div class="row action" onclick="toggleFlag('allTracks',this);render()"><span>⌘</span><label data-i18n="tracks_all">Show tracks for all aircraft</label></div>
  <div class="row action selected" onclick="toggleFlag('lastLeg',this);render()"><span>↥</span><label data-i18n="last_leg_only">Show last leg only</label></div>
  <div class="row action" onclick="toggleFlag('multiple',this)"><span>▣</span><label data-i18n="select_multiple">Select multiple aircraft</label></div>
  <div class="row action" onclick="randomAircraft();closePanels()"><span>↗</span><label data-i18n="random_aircraft">Follow a random aircraft</label></div>
  <div class="row action" onclick="showBookmarks()"><span>☆</span><label data-i18n="bookmarks">Bookmarks</label><b>›</b></div>
</div>

<div id="filters" class="filters"><button class="close" onclick="closePanels()">×</button><h2 data-i18n="aircraft_filters">Aircraft filters</h2>
  <div class="filter-row"><b data-i18n="type_code">Type code</b><input id="fType"></div><div class="filter-row"><b data-i18n="type_description">Type description</b><input id="fDesc"></div><div class="filter-row"><b data-i18n="hex_id">ICAO hex id</b><input id="fHex"></div>
  <div class="filter-row"><b data-i18n="source">Source</b><div class="chips" id="sourceChips"></div></div><div class="filter-row"><b data-i18n="db_flags">Database flags</b><div class="chips" id="flagChips"></div></div>
  <div class="filter-row"><b data-i18n="registration">Registration</b><input id="fReg"></div><div class="filter-row"><b data-i18n="country_prefix">Country / registration prefix</b><input id="fCountry"></div><div class="filter-row"><b data-i18n="category">Category (A3, B0, …)</b><input id="fCategory"></div>
  <button class="apply" data-i18n="apply_filters" onclick="applyFilters()">Apply filters</button><button class="reset" data-i18n="clear_filters" onclick="clearFilters()">Clear all filters</button>
</div>
<div id="bookmarks" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="bookmarks">Bookmarks</h1><div id="bookmarkList"></div></div>
<div id="info" class="info"></div>

<script>
  const map=L.map('map',{zoomControl:false,preferCanvas:true,trackResize:true,minZoom:3,zoomSnap:0,zoomDelta:.25,bounceAtZoomLimits:false}).setView([51,10],6);
  const baseTiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:3,maxZoom:19,maxNativeZoom:19,keepBuffer:6,updateWhenIdle:false,updateWhenZooming:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
  const ownLayer=L.layerGroup().addTo(map);let ownMarker=null;
  const trafficCanvas=document.getElementById('trafficCanvas'),trafficContext=trafficCanvas.getContext('2d');
  map.getContainer().appendChild(trafficCanvas);
  const API_MAX_RADIUS_NM=2500;
  let aircraft=[],settings={},own=[null,null],centered=false,selected=new Set(),history=new Map(),lastSeen=new Map(),known=new Map(),positionSnapshots=new Map(),labelShownAt=new Map(),renderedTargets=[],canvasFrame=0,canvasRenders=0,pendingFocus=null,searchSuggestionIndex=-1,searchSuggestionItems=[],renderStats={planes:0,rotorcraft:0,groundVehicles:0,labels:0,trails:0,trackPoints:0};
  const aircraftPhotoCache=new Map(),aircraftPhotoRequests=new Map(),aircraftPhotoFailures=new Map(),destinationCache=new Map(),destinationRequests=new Set();
  let flags={follow:false,isolate:false,allTracks:false,lastLeg:true,multiple:false,militaryOnly:false},filters={sources:new Set(),db:new Set()},sessionOverrides=new Set(),filtersRestored=false;
  const defaults={textScale:1,iconScale:1,dim:true,coloredPlanes:true,coloredTrails:true,showLabels:true,labelTransparency:.6,labelUnits:true,smallLabels:true,geometricAltitude:false,egmConversion:false,qnhCorrection:false,historicTrackUtc:true,altitudeChart:true,autoSelect:false,groundVehicles:true,nonIcao:true,updateGps:true,includeFiltersUrl:false,keepFaded:false,debugTracks:false,debugShowAll:false,metric:false};
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const finite=v=>typeof v==='number'&&Number.isFinite(v), norm=v=>String(v||'').trim().toLowerCase();
  const tr=(key,fallback)=>settings.strings&&settings.strings[key]||fallback||key;
  function applyTranslations(){document.documentElement.dir=settings.rtl?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n,x.textContent));document.querySelectorAll('[data-i18n-placeholder]').forEach(x=>x.placeholder=tr(x.dataset.i18nPlaceholder,x.placeholder));document.querySelectorAll('[data-i18n-title]').forEach(x=>{x.title=tr(x.dataset.i18nTitle,x.title);x.setAttribute('aria-label',x.title)});document.querySelectorAll('[data-option-key]').forEach(x=>x.textContent=tr(x.dataset.optionKey,x.textContent))}
  function openSheet(id){closePanels();document.getElementById(id).classList.add('open')}
  function closePanels(){document.querySelectorAll('.sheet,.filters').forEach(x=>x.classList.remove('open'))}
  function toggleSearch(){const panel=document.getElementById('search'),opening=!panel.classList.contains('open');panel.classList.toggle('open',opening);if(opening){const input=document.getElementById('searchText');input.focus();input.select();updateSearchSuggestions()}else hideSearchSuggestions()}
  function openFilters(){closePanels();document.getElementById('filters').classList.add('open')}
  function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
  function resetView(){if(finite(own[0]))map.setView(own,10)}
  function locateMe(){if(finite(own[0]))map.flyTo(own,Math.max(map.getZoom(),12),{duration:.65})}
  function clearTracks(){history.clear();render()}
  function syncIsolationQuery(){if(window.MarNative&&MarNative.setIsolatedAircraft)MarNative.setIsolatedAircraft(flags.isolate&&selected.size?[...selected].pop():'')}
  function toggleFlag(k,row){flags[k]=!flags[k];row.classList.toggle('selected',flags[k]);if(k==='follow')followSelected();if(k==='isolate')syncIsolationQuery()}
  function toggleFilterMilitary(row){flags.militaryOnly=!flags.militaryOnly;row.classList.toggle('selected',flags.militaryOnly);render()}
  function searchChanged(){const panel=document.getElementById('search');panel.classList.remove('miss');document.getElementById('searchResult').textContent='';searchSuggestionIndex=-1;updateSearchSuggestions();render()}

  function loadFrequentDestinations(a){const key=norm(a&&a.hex).replace(/^~/,'');if(!/^[0-9a-f]{6}$/.test(key))return;const root=document.getElementById(destinationId(key));if(destinationCache.has(key)){if(root)root.innerHTML=destinationHtml(destinationCache.get(key));return}if(destinationRequests.has(key))return;destinationRequests.add(key);if(window.MarNative&&MarNative.requestFrequentDestinations){MarNative.requestFrequentDestinations(key);return}window.marFrequentDestinationsResult(key,{destinations:[],window_days:30,scanned_days:0})}
  function angleValue(value){return finite(value)?Math.round(value)+'°':''}
  function feetValue(value){if(!finite(value))return'';return settings.metric?Math.round(value*.3048)+' m':Math.round(value)+' ft'}
  function speedValue(value){if(!finite(value))return'';return settings.metric?Math.round(value*1.852)+' km/h':Math.round(value)+' kt'}
  function rateValue(value){if(!finite(value))return'';return settings.metric?Number(value*.00508).toFixed(1)+' m/s':Math.round(value)+' ft/min'}
  function transmissionSource(a){const source=sourceGroup(a);return({adsb:'ADS-B',adsr:'ADS-R / UAT',mlat:'MLAT',tisb:'TIS-B',mode_s:'Mode-S',adsc:'ADS-C',other:tr('other','Other')})[source]}
  let infoDragStartY=0,infoDragStartHeight=0;
  function beginInfoDrag(event){const box=document.getElementById('info');infoDragStartY=event.clientY;infoDragStartHeight=box.getBoundingClientRect().height;event.currentTarget.setPointerCapture&&event.currentTarget.setPointerCapture(event.pointerId);event.preventDefault()}

  function applyAircraftPhoto(root,html,animate){if(!root)return;const head=root.closest('.info-head'),hide=()=>{root.style.display='none';root.classList.remove('loaded','fallback');head&&head.classList.remove('photo-loaded')};if(!html){hide();return}root.innerHTML=html;root.style.display='';root.classList.toggle('fallback',!!root.querySelector('.photo-warning'));const img=root.querySelector('img'),show=()=>{if(!root.isConnected)return;head&&head.classList.add('photo-loaded');if(animate)requestAnimationFrame(()=>root.classList.add('loaded'));else root.classList.add('loaded')};if(!img){hide();return}img.addEventListener('load',show,{once:true});img.addEventListener('error',hide,{once:true});if(img.complete){if(img.naturalWidth>0)show();else hide()}}
  function aircraftPhotoHtml(data,registration){if(!data||!/^https:\/\//i.test(data.image||''))return'';const link=/^https:\/\//i.test(data.link||'')?data.link:data.image,credit=[data.source,data.credit].filter(Boolean).join(' · '),warning=data.uncertain?'<span class="photo-warning">⚠ '+esc(tr('photo_may_differ','Photo may differ'))+'</span>':'';return'<a href="'+esc(link)+'"><img src="'+esc(data.image)+'" alt="'+esc(registration)+'"><small>'+esc(credit)+' ↗</small>'+warning+'</a>'}
  window.marPhotoResult=function(hex,registration,data){const key=norm(registration),id='photo-'+String(hex||'').replace(/[^a-z0-9]/gi,''),html=aircraftPhotoHtml(data,registration);aircraftPhotoRequests.delete(key);if(html){aircraftPhotoCache.set(key,html);aircraftPhotoFailures.delete(key)}else{aircraftPhotoCache.delete(key);aircraftPhotoFailures.set(key,Date.now())}const root=document.getElementById(id);if(root&&root.dataset.registration===key)applyAircraftPhoto(root,html,true)};
  function loadAircraftPhoto(a){const id='photo-'+String(a.hex||'').replace(/[^a-z0-9]/gi,''),key=norm(a.registration);if(!key)return;const root=document.getElementById(id);if(!root)return;if(aircraftPhotoCache.has(key)){applyAircraftPhoto(root,aircraftPhotoCache.get(key),false);return}if(Date.now()-(aircraftPhotoFailures.get(key)||0)<60000||aircraftPhotoRequests.has(key))return;aircraftPhotoRequests.set(key,true);if(window.MarNative&&MarNative.requestAircraftPhoto){MarNative.requestAircraftPhoto(String(a.hex||''),String(a.registration||''),String(a.description||a.type||''));return}if(typeof fetch!=='function'){window.marPhotoResult(a.hex,a.registration,{});return}fetch('https://api.planespotters.net/pub/photos/reg/'+encodeURIComponent(a.registration)).then(response=>response.json()).then(data=>{const p=data.photos&&data.photos[0],thumb=p&&(p.thumbnail_large||p.thumbnail);window.marPhotoResult(a.hex,a.registration,p&&thumb?{image:thumb.src,link:p.link,source:'Planespotters.net',credit:p.photographer}:{} )}).catch(()=>window.marPhotoResult(a.hex,a.registration,{}))}
  function showInfo(hex){
    const a=aircraft.find(x=>x.hex===hex)||known.get(hex);if(!a)return;
    const box=document.getElementById('info'),name=a.display_name||a.registration||a.hex,sources=Array.isArray(a.sources)?a.sources.join(' + '):'',registrationKey=norm(a.registration),currentPhoto=box.querySelector('.header-photo'),preservedPhoto=currentPhoto&&currentPhoto.dataset.registration===registrationKey?currentPhoto:null;
    let links='';if(a.registration)links='<a href="https://www.planespotters.net/search?q='+encodeURIComponent(a.registration)+'">Planespotters · '+esc(tr('photos','Photos'))+' ↗</a> <a href="https://www.planespotting.be/search?q='+encodeURIComponent(a.registration)+'">Planespotting · '+esc(tr('photos','Photos'))+' ↗</a>';
    const groundSpeed=speedValue(a.speed_knots),geometricInfo=settings.egmConversion&&finite(a.geometric_msl_altitude_ft)?a.geometric_msl_altitude_ft:a.geometric_altitude_ft,modes=Array.isArray(a.nav_modes)?a.nav_modes.join(', '):a.nav_modes,temperatures=[finite(a.total_air_temp_c)?'TAT '+Math.round(a.total_air_temp_c)+' °C':'',finite(a.outside_air_temp_c)?'OAT '+Math.round(a.outside_air_temp_c)+' °C':''].filter(Boolean).join(' / ');
    const identity=infoPair(tr('registration','Registration'),a.registration)+infoPair(tr('country','Country'),a.country)+infoPair(tr('type_code','Type code'),a.type||tr('unknown_type','Unknown type'))+infoPair(tr('type_description','Type description'),a.description)+infoPair(tr('squawk','Squawk'),a.squawk);
    const spatial=infoPair(tr('ground_speed','Ground speed'),groundSpeed)+infoPair(tr('barometric','Barometric altitude'),a.on_ground?tr('ground','Ground'):feetValue(a.barometric_altitude_ft))+infoPair('WGS84',feetValue(a.geometric_altitude_ft))+infoPair(tr('vertical_rate','Vertical rate'),rateValue(a.vertical_rate))+infoPair(tr('ground_track','Track'),angleValue(a.track))+infoPair(tr('position','Position'),finite(a.lat)&&finite(a.lon)?Number(a.lat).toFixed(5)+'°, '+Number(a.lon).toFixed(5)+'°':'')+infoPair(tr('distance','Distance'),distanceText(a));
    const signal=infoPair(tr('source','Source'),transmissionSource(a))+infoPair('RSSI',finite(a.rssi)?Number(a.rssi).toFixed(1)+' dBFS':'')+infoPair(tr('message_rate','Message rate'),finite(a.message_rate)?Number(a.message_rate).toFixed(1)+' /s':'')+infoPair(tr('receivers','Receivers'),a.receivers||'')+infoPair(tr('last_position','Last position'),finite(a.seen_position)?Number(a.seen_position).toFixed(1)+' s':'')+infoPair(tr('last_seen','Last seen'),finite(a.seen)?Number(a.seen).toFixed(1)+' s':'');
    const fms=infoPair(tr('selected_altitude','Selected altitude'),feetValue(a.selected_altitude_ft))+infoPair(tr('selected_heading','Selected heading'),angleValue(a.selected_heading));
    const wind=infoPair(tr('speed','Speed'),speedValue(a.wind_speed_knots))+infoPair(tr('direction','Direction'),angleValue(a.wind_direction))+infoPair('TAT / OAT',temperatures);
    const speed=infoPair(tr('ground_speed','Ground'),groundSpeed)+infoPair('TAS',speedValue(a.true_airspeed_knots))+infoPair('IAS',speedValue(a.indicated_airspeed_knots))+infoPair('Mach',finite(a.mach)?Number(a.mach).toFixed(2):'');
    const altitudeDetails=infoPair(tr('barometric','Barometric'),a.on_ground?tr('ground','Ground'):feetValue(a.barometric_altitude_ft))+infoPair(tr('baro_rate','Barometric rate'),rateValue(a.barometric_rate))+infoPair('WGS84',feetValue(geometricInfo))+infoPair(tr('geom_rate','Geometric rate'),rateValue(a.geometric_rate))+infoPair('QNH',finite(a.qnh_hpa)?Number(a.qnh_hpa).toFixed(1)+' hPa':'');
    const direction=infoPair(tr('ground_track','Ground track'),angleValue(a.track))+infoPair(tr('true_heading','True heading'),angleValue(a.true_heading))+infoPair(tr('magnetic_heading','Magnetic heading'),angleValue(a.magnetic_heading))+infoPair(tr('magnetic_declination','Magnetic declination'),angleValue(a.magnetic_declination))+infoPair(tr('track_rate','Track rate'),finite(a.track_rate)?Number(a.track_rate).toFixed(2)+' °/s':'')+infoPair(tr('roll','Roll'),angleValue(a.roll));
    const system=infoPair(tr('nav_modes','Navigation modes'),modes)+infoPair('ADS-B',a.adsb_version==null?'':'v'+a.adsb_version)+infoPair(tr('category','Category'),a.category);
    const accuracy=infoPair('NACP',a.nac_p)+infoPair('SIL',a.sil)+infoPair('NACV',a.nac_v)+infoPair('NICBARO',a.nic_baro)+infoPair('RC',finite(a.rc_m)?Math.round(a.rc_m)+' m':'');
    const extra=infoPair('ICAO',String(a.hex||'').toUpperCase())+infoPair(tr('db_flags','Database flags'),a.db_flags)+infoPair(tr('operator','Operator'),a.operator)+infoPair(tr('data_provider','Data provider'),sources)+infoPair(tr('emergency','Emergency'),a.emergency)+infoPair('Alert / SPI',[a.alert,a.spi].filter(v=>v!=null).join(' / '))+infoPair(tr('messages','Messages'),a.messages?String(a.messages):'')+infoPair(tr('position_epoch','Position epoch'),a.position_epoch)+infoPair(tr('military','Military'),a.military?'✓':'')+infoPair(tr('rotorcraft','Rotorcraft'),a.rotorcraft?'✓':'');
    const badges=(a.military?'<span class="info-badge military">'+esc(tr('military','Military')).toUpperCase()+'</span>':'')+(a.rotorcraft?'<span class="info-badge rotor">'+esc(tr('rotorcraft','Rotorcraft'))+'</span>':'')+(a.type?'<span class="info-badge">'+esc(a.type)+'</span>':'');
    const photoId='photo-'+String(a.hex||'').replace(/[^a-z0-9]/gi,'');

    const destinationKey=norm(a.hex).replace(/^~/,'');
    box.innerHTML='<header class="info-head">'+(a.registration?'<div id="'+photoId+'" class="header-photo" data-registration="'+esc(registrationKey)+'"></div>':'')+'<div class="sheet-handle" onpointerdown="beginInfoDrag(event)"></div><button class="close" onclick="closeInfo()">×</button><div class="info-title-content"><h3>'+esc(name)+'</h3><div class="info-sub">'+esc(String(a.hex||'').toUpperCase())+(a.registration?' · '+esc(a.registration):'')+'</div>'+badges+'</div></header><div class="identity-card info-grid">'+identity+'</div><section class="info-section"><h4>'+esc(tr('frequent_destinations','Frequent destinations'))+'</h4><div id="'+destinationId(destinationKey)+'" class="destination-list">'+(destinationCache.has(destinationKey)?destinationHtml(destinationCache.get(destinationKey)):'<div class="destination-loading">'+esc(tr('analyzing_legs','Analyzing available legs…'))+'</div>')+'</div></section>'+infoSection(tr('spatial','Spatial'),spatial)+infoSection(tr('signal','Signal'),signal)+infoSection(tr('fms_selected','FMS selected'),fms)+infoSection(tr('wind','Wind'),wind)+infoSection(tr('speed','Speed'),speed)+infoSection(tr('altitude_details','Altitude'),altitudeDetails)+infoSection(tr('direction','Direction'),direction)+infoSection(tr('system_data','System'),system)+infoSection(tr('accuracy','Accuracy'),accuracy)+infoSection(tr('extra_info','Extra info'),extra)+'<div class="extra-links">'+links+'</div>';
    const placeholder=document.getElementById(photoId);if(preservedPhoto&&placeholder){placeholder.replaceWith(preservedPhoto);if(preservedPhoto.classList.contains('loaded'))preservedPhoto.closest('.info-head').classList.add('photo-loaded')}else if(a.registration)loadAircraftPhoto(a);loadFrequentDestinations(a)
  }
  function randomAircraft(){const v=visibleAircraft();if(v.length)selectAircraft(v[Math.floor(Math.random()*v.length)].hex)}
  function toggleBookmark(){if(!selected.size)return;const list=JSON.parse(localStorage.getItem('marBookmarks')||'[]'),hex=[...selected][0],i=list.indexOf(hex);i<0?list.push(hex):list.splice(i,1);localStorage.setItem('marBookmarks',JSON.stringify(list))}
  function showBookmarks(){openSheet('bookmarks');const list=JSON.parse(localStorage.getItem('marBookmarks')||'[]'),root=document.getElementById('bookmarkList');root.innerHTML='';if(!list.length){root.innerHTML='<div class="row">'+esc(tr('no_bookmarks','No bookmarked aircraft'))+'</div>';return}list.forEach(hex=>{const a=known.get(hex),row=document.createElement('div');row.className='row action';row.innerHTML='<span>☆</span><label>'+esc(a?(a.display_name||a.registration||hex):hex)+'</label>';row.onclick=()=>{if(a){closePanels();selectAircraft(hex);map.setView([a.lat,a.lon],11)}};root.appendChild(row)})}
  map.on('click',e=>{const point=e.containerPoint;let nearest=null,best=Infinity;renderedTargets.forEach(target=>{const dx=target.x-point.x,dy=target.y-point.y,d=dx*dx+dy*dy,limit=Math.max(14,target.size*.8);if(d<best&&d<=limit*limit){nearest=target;best=d}});if(nearest)selectAircraft(nearest.hex)});
  function filterState(){const state={};['fType','fDesc','fHex','fReg','fCountry','fCategory'].forEach(id=>{const v=document.getElementById(id).value;if(v)state[id]=v});if(filters.sources.size)state.sources=[...filters.sources];if(filters.db.size)state.db=[...filters.db];return state}
  function syncFilterUrl(){if(!settings.includeFiltersUrl){if(location.hash.startsWith('#filters='))window.history.replaceState(null,'',location.pathname);return}const state=filterState(),value=Object.keys(state).length?'#filters='+encodeURIComponent(JSON.stringify(state)):'';window.history.replaceState(null,'',location.pathname+value)}
  function restoreFiltersFromUrl(){if(filtersRestored||!settings.includeFiltersUrl)return;filtersRestored=true;if(!location.hash.startsWith('#filters='))return;try{const state=JSON.parse(decodeURIComponent(location.hash.slice(9)));['fType','fDesc','fHex','fReg','fCountry','fCategory'].forEach(id=>{if(state[id])document.getElementById(id).value=state[id]});filters.sources=new Set(state.sources||[]);filters.db=new Set(state.db||[]);document.querySelectorAll('#sourceChips .chip,#flagChips .chip').forEach(x=>x.classList.toggle('active',filters.sources.has(x.dataset.v)||filters.db.has(x.dataset.v)))}catch(e){}}
  function applyFilters(){filters.sources=new Set([...document.querySelectorAll('#sourceChips .active')].map(x=>x.dataset.v));filters.db=new Set([...document.querySelectorAll('#flagChips .active')].map(x=>x.dataset.v));syncFilterUrl();closePanels();render()}
  function clearFilters(){document.querySelectorAll('.filters input').forEach(x=>x.value='');document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));filters={sources:new Set(),db:new Set()};syncFilterUrl();render()}
  function chip(container,label,value,extra,labelKey){const b=document.createElement('button');b.className='chip '+(extra||'');b.textContent=label;b.dataset.v=value;if(labelKey)b.dataset.i18n=labelKey;b.onclick=()=>b.classList.toggle('active');container.appendChild(b)}
  [['ADS-B','adsb'],['UAT / ADS-R','adsr'],['MLAT','mlat'],['TIS-B','tisb'],['Mode-S','mode_s'],['ADS-C','adsc'],['Other','other']].forEach(x=>chip(document.getElementById('sourceChips'),x[0],x[1]));[['Military','military','military','military'],['PIA','pia','',''],['LADD','ladd','','']].forEach(x=>chip(document.getElementById('flagChips'),x[0],x[1],x[2],x[3]));
  function applyAppearance(){document.documentElement.style.setProperty('--scale',settings.textScale||1);document.body.classList.toggle('dim',settings.dim!==false)}
  window.marResize=function(){map.invalidateSize({pan:false,animate:false});scheduleCanvas();setTimeout(()=>{map.invalidateSize({pan:false,animate:false});scheduleCanvas()},60);setTimeout(()=>{map.invalidateSize({pan:false,animate:false});scheduleCanvas()},240)};
  window.marUpdate=function(raw,ownLat,ownLon,_radiusKm,nativeSettings){if(!Object.keys(settings).length)settings={...defaults,...nativeSettings};else Object.keys(nativeSettings).forEach(k=>{if(!sessionOverrides.has(k))settings[k]=nativeSettings[k]});own=[ownLat,ownLon];if(settings.updateGps&&finite(ownLat)&&finite(ownLon)&&!centered){resetView();centered=true}let next=[];try{next=JSON.parse(raw)||[]}catch(e){}cachePositionSnapshots(next);aircraft=next;next.forEach(a=>{known.delete(a.hex);known.set(a.hex,a)});while(known.size>2000)known.delete(known.keys().next().value);if(next.length)updateHistory(next);restoreFiltersFromUrl();syncFilterUrl();applyTranslations();if(settings.updateGps&&finite(ownLat)&&finite(ownLon)){if(!ownMarker){const icon=L.divIcon({className:'own-dot',iconSize:[18,18],iconAnchor:[9,9]});ownMarker=L.marker(own,{icon}).bindTooltip(tr('your_position','Your position')).addTo(ownLayer)}else ownMarker.setLatLng(own)}else if(ownMarker){ownLayer.removeLayer(ownMarker);ownMarker=null}const infoOpen=document.getElementById('info').classList.contains('open');render();applyPendingFocus();if(infoOpen&&selected.size)showInfo([...selected].pop())};
  let viewportTimer=0;function reportViewport(){clearTimeout(viewportTimer);viewportTimer=setTimeout(()=>{if(!window.MarNative||!MarNative.setMapViewport)return;const center=map.getCenter();MarNative.setMapViewport(center.lat,center.lng,requestedViewportRadiusNm())},180)}
  map.on('move zoom resize',scheduleCanvas);map.on('moveend zoomend',()=>{scheduleCanvas();reportViewport()});window.addEventListener('resize',()=>{window.marResize();reportViewport()});
