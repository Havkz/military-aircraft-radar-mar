<html lang="en">

    .leaflet-container{background:#dce4e8}body.dark .leaflet-tile-pane{filter:brightness(.57) saturate(.78) contrast(1.12)}body.darker .leaflet-tile-pane{filter:brightness(.4) saturate(.68) contrast(1.18)}body.dim .leaflet-tile-pane{opacity:.62}
    .toolbar{position:absolute;z-index:700;top:8px;left:8px;right:8px;display:flex;gap:5px;pointer-events:none}.tools{display:flex;background:rgba(0,0,0,.88);border-radius:20px;padding:2px;box-shadow:0 2px 7px #0007;pointer-events:auto}.tools.right{margin-left:auto}
    .map-location{position:absolute;z-index:700;top:56px;right:12px;width:44px;height:44px;border:1px solid #d3dbe0;border-radius:50%;background:rgba(255,255,255,.96);color:#176cba;font-size:23px;box-shadow:0 3px 12px #0005;transition:transform .14s,background .18s;backdrop-filter:blur(8px)}.map-location:active{transform:scale(.92);background:#e7f3fc}body.dark .map-location,body.darker .map-location{border-color:#334650;background:rgba(8,15,20,.94);color:#62c7ff}.map-location span{display:block;transform:translateY(-1px)}
    button,.tool{border:0;color:#fff;background:transparent;font:inherit}.tool{width:34px;height:34px;border-radius:17px;font-size:18px;padding:0}.tool.active{background:#075dab;color:#fff}.tool:active{background:#26313a}.search{position:absolute;z-index:710;top:52px;left:8px;right:8px;background:#050709;border:1px solid var(--line);border-radius:12px;padding:8px;display:none}.search.open{display:flex}.search input,.filters input{min-width:0;flex:1;background:#0d1318;border:1px solid #62707a;color:#fff;border-radius:8px;padding:9px;font:inherit}
    .sheet{position:absolute;z-index:900;left:8px;top:50px;bottom:8px;width:min(330px,calc(100% - 16px));background:linear-gradient(155deg,rgba(10,19,16,.985),rgba(4,8,7,.985));border:1px solid #263f35;border-radius:22px;padding:16px 14px 22px;overflow:auto;display:none;box-shadow:0 12px 38px #000d}.sheet.open{display:block;animation:panelIn .22s cubic-bezier(.2,.9,.2,1)}@keyframes panelIn{from{opacity:0;transform:translateX(-14px) scale(.98)}to{opacity:1;transform:none}}.sheet h1{font-size:20px;margin:0 34px 12px 0}.close{position:absolute;right:12px;top:7px;font-size:27px}.section{color:#6ea8ff;text-transform:uppercase;font-size:10px;letter-spacing:.12em;margin:19px 5px 6px}.row{display:flex;align-items:center;gap:9px;padding:9px 9px;border-top:1px solid transparent}.row.action{font-size:14px;border-radius:13px;transition:background .14s,transform .12s}.row.action:active{background:#18372d;transform:scale(.98)}.row.action span:first-child{font-size:18px;width:24px;color:#39d98a}.row.action.selected{background:#142d25;color:#eafaf2}.row.action.selected:after{content:'✓';margin-left:auto;color:#39d98a}.row label{flex:1}.row input[type=checkbox]{width:19px;height:19px;accent-color:#39d98a}.row input[type=range]{width:43%;accent-color:#6ea8ff}
    .filters{position:absolute;z-index:900;left:8px;top:50px;bottom:8px;width:min(330px,calc(100% - 16px));background:linear-gradient(155deg,rgba(10,19,16,.99),rgba(4,8,7,.99));border:1px solid #263f35;border-radius:22px;padding:16px;overflow:auto;display:none;box-shadow:0 12px 38px #000d}.filters.open{display:block;animation:panelIn .22s cubic-bezier(.2,.9,.2,1)}.filters h2{font-size:19px;margin:0 28px 12px 0}.filter-row{margin:13px 0}.filter-row b{display:block;color:#a9beb5;margin:0 2px 6px;font-size:11px;letter-spacing:.04em}.filter-row input{box-sizing:border-box;width:100%;background:#09110e;color:#eef8f3;border:1px solid #29483b;border-radius:12px;padding:10px 11px;outline:none;transition:border-color .15s,box-shadow .15s}.filter-row input:focus{border-color:#6ea8ff;box-shadow:0 0 0 2px #6ea8ff33}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#0a1411;border:1px solid #38594b;border-radius:14px;padding:8px 11px;transition:transform .12s,background .16s,border-color .16s,box-shadow .16s}.chip:active{transform:scale(.95)}.chip.active{background:linear-gradient(135deg,#184c3a,#123b30);border-color:#39d98a;box-shadow:0 0 0 1px #39d98a22;color:#eafff5}.chip.military.active{background:linear-gradient(135deg,#6b2730,#45151d);border-color:#ff6675}.apply{background:linear-gradient(135deg,#2877da,#1658af);border:1px solid #6ea8ff;border-radius:18px;padding:8px 14px;margin-left:6px;box-shadow:0 5px 14px #004c9944}.reset{border:1px solid #526b61;border-radius:18px;padding:8px 14px;background:#0b1411}
    .aircraft-marker{background:transparent!important;border:0!important}.aircraft-wrap{position:relative;width:100%;height:100%;overflow:visible}.aircraft{width:100%;height:100%;filter:drop-shadow(0 1px 1px #fff) drop-shadow(0 1px 2px #000);transition:opacity .15s}.aircraft svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:center}.aircraft.selected{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff)}.aircraft.faded{opacity:.28}.plane-label{position:absolute;left:calc(100% + 4px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#071018e8;color:#fff;border-radius:4px;padding:2px 5px;font-size:11px;font-weight:600;pointer-events:none}.small-label .plane-label{font-size:9px}.wind-label{color:#9ee8ff;font-size:10px}.small-wind .wind-label{font-size:8px}.own-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #111}
    .info{position:absolute;z-index:750;left:8px;right:8px;bottom:10px;height:31vh;min-height:170px;max-height:76vh;overflow:auto;background:rgba(4,7,10,.97);border:1px solid #3d4a54;border-radius:16px 16px 12px 12px;padding:0 12px 12px;display:none;box-shadow:0 7px 26px #000c}.info.open{display:block}.info.wide{height:70vh}.info-head{position:sticky;top:0;z-index:2;min-height:96px;margin:0 -12px 8px;padding:22px 42px 10px 13px;overflow:hidden;background:linear-gradient(135deg,#07356f,#071b37);border-bottom:1px solid #2f78b9}.info-title-content{position:relative;z-index:2;max-width:64%;min-height:62px}.sheet-handle{position:absolute;z-index:4;top:0;left:50%;width:128px;height:38px;transform:translateX(-50%);touch-action:none;cursor:ns-resize}.sheet-handle:after{content:'';position:absolute;left:50%;top:7px;width:54px;height:5px;transform:translateX(-50%);border-radius:4px;background:#8bb2cf}.info-head .close{z-index:5}.info-head h3{margin:0;color:#fff;font-size:21px;overflow-wrap:anywhere;text-shadow:0 2px 8px #00152d}.info-sub{margin-top:3px;color:#b9d9f2;font-size:11px;letter-spacing:.04em;text-shadow:0 1px 5px #00152d}.info-badge{display:inline-block;margin:6px 5px 0 0;padding:3px 7px;border-radius:10px;background:#153a55;color:#9edcff;font-size:10px;font-weight:700}.info-badge.military{background:#5b2600;color:#ffc26b}.info-badge.rotor{background:#063d31;color:#73f1c5}.header-photo{position:absolute;z-index:1;top:0;right:0;width:58%;height:100%;opacity:0;transform:scale(1.035);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);-webkit-mask-image:linear-gradient(to left,#000 0,#000 54%,transparent 100%);mask-image:linear-gradient(to left,#000 0,#000 54%,transparent 100%)}.header-photo.loaded{opacity:.82;transform:scale(1)}.header-photo a,.header-photo img{display:block;width:100%;height:100%}.header-photo img{object-fit:cover;object-position:center}.header-photo small{position:absolute;right:7px;bottom:4px;max-width:70%;overflow:hidden;color:#e2ed ribution a{color:#8ed5ff!important}.leaflet-control-zoom{border:0!important;box-shadow:0 2px 7px #0008!important}.leaflet-control-zoom a{width:30px!important;height:30px!important;line-height:30px!important;background:#090c0f!important;color:#fff!important;border-color:#343b41!important}
  </style>
</head>
<body>
<div id="map"></div>
<canvas id="trafficCanvas"></canvas>
<div class="toolbar"><div class="tools"><button class="tool" data-i18n-title="map_menu" onclick="openSheet('menu')">☰</button><button class="tool" data-i18n-title="find" onclick="toggleSearch()">⌕</button></div></div>
<button id="locationButton" class="map-location" data-i18n-title="reset_view" onclick="locateMe()"><span>⌖</span></button>
<div id="search" class="search"><input id="searchText" data-i18n-placeholder="search_hint" placeholder="Callsign, registration, hex or type" oninput="render()"><button class="apply" data-i18n="find" onclick="selectFirstMatch()">Find</button></div>
<div id="empty" class="empty" data-i18n-title="waiting"><i class="spinner"></i></div><div id="zoomWarning" class="zoom-warning" data-i18n="zoom_in_traffic">Zoom in to load live traffic</div><div id="measureNote" class="measure-note" data-i18n="tap_two">Tap two points</div>

<div id="menu" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="map_menu">Map menu</h1>
  <div class="row action" onclick="toggleFlag('trackTimestamps',this)"><span>◷</span><label data-i18n="timestamps">Timestamps on tracks</label></div>
  <div class="row action" onclick="resetView();closePanels()"><span>⌂</span><label data-i18n="reset_view">Reset map view</label></div>
  <div class="row action" onclick="toggleFlag('follow',this)"><span>⌖</span><label data-i18n="follow_selected">Follow selected aircraft</label></div>
  <div class="section" data-i18n="filters">Filters</div>
  <div class="row action" onclick="toggleFilterMilitary(this)"><span>♢</span><label data-i18n="military_only">Military only</label></div>
  <div class="row action" onclick="toggleFlag('isolate',this);render()"><span>◉</span><label data-i18n="isolate_selected">Isolate selected aircraft</label></div>
  <div class="row action" onclick="openFilters()"><span>▽</span><label data-i18n="all_filters">All filter options…</label><b>›</b></div>
  <div class="section" data-i18n="tools">Tools</div>
  <div class="row action" onclick="toggleFlag('allTracks',this);render()"><span>⌘</span><label data-i18n="tracks_all">Show tracks for all aircraft</label></div>
  <div class="row action" onclick="toggleFlag('multiple',this)"><span>▣</span><label data-i18n="select_multiple">Select multiple aircraft</label></div>
  <div class="row action" onclick="randomAircraft();closePanels()"><span>↗</span><label data-i18n="random_aircraft">Follow a random aircraft</label></div>
  <div class="row action" onclick="startMeasure();closePanels()"><span>⌁</span><label data-i18n="measure_distance">Measure distance</label></div>
  <div class="row action" onclick="showBookmarks()"><span>☆</span><label data-i18n="bookmarks">Bookmarks</label><b>›</b></div>
</div>

<div id="filters" class="filters"><button class="close" onclick="closePanels()">×</button><h2 data-i18n="aircraft_filters">Aircraft filters</h2>
  <div class="filter-row"><b data-i18n="type_code">Type code</b><input id="fType"></div><div class="filter-row"><b data-i18n="type_description">Type description</b><input id="fDesc"></div><div class="filter-row"><b data-i18n="hex_id">ICAO hex id</b><input id="fHex"></div>
  <div class="filter-row"><b data-i18n="source">Source</b><div class="chips" id="sourceChips"></div></div><div class="filter-row"><b data-i18n="db_flags">Database flags</b><div class="chips" id="flagChips"></div></div>
  <div class="filter-row"><b data-i18n="registration">Registration</b><input id="fReg"></div><div class="filter-row"><b data-i18n="country_prefix">Country / registration prefix</b><input id="fCountry"></div><div class="filter-row"><b data-i18n="category">Category (A3, B0, …)</b><input id="fCategory"></div>
  <button class="apply" data-i18n="apply_filters" onclick="applyFilters()">Apply filters</button><button class="reset" data-i18n="clear_filters" onclick="clearFilters()">Clear all filters</button>
</div>
<div id="bookmarks" class="sheet"><button class="close" onclick="closePanels()">×</button><h1 data-i18n="bookmarks">Bookmarks</h1><div id="bookmarkList"></div></div>
<div id="info" class="info"></div>

<script>
  const map=L.map('map',{zoomControl:false,preferCanvas:true,trackResize:true,minZoom:5}).setView([51,10],6);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const baseTiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:5,maxZoom:19,maxNativeZoom:19,keepBuffer:6,updateWhenIdle:false,updateWhenZooming:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
  const ownLayer=L.layerGroup().addTo(map),measureLayer=L.layerGroup().addTo(map);
  const trafficCanvas=document.getElementById('trafficCanvas'),trafficContext=trafficCanvas.getContext('2d');
  map.getContainer().appendChild(trafficCanvas);
  const MIN_TRAFFIC_ZOOM=6;
  let aircraft=[],settings={},own=[null,null],centered=false,selected=new Set(),history=new Map(),lastSeen=new Map(),known=new Map(),labelShownAt=new Map(),renderedTargets=[],canvasFrame=0,canvasRenders=0,trafficPaused=null,pendingFocus=null,renderStats={planes:0,rotorcraft:0,groundVehicles:0,labels:0,trails:0};
  let flags={follow:false,isolate:false,allTracks:false,multiple:false,trackTimestamps:false,militaryOnly:false},filters={sources:new Set(),db:new Set()},measurePoints=[],sessionOverrides=new Set(),filtersRestored=false;
  const defaults={textScale:1,iconScale:1,dark:false,darker:false,dim:false,coloredPlanes:true,coloredTrails:true,showLabels:false,labelUnits:true,smallLabels:true,geometricAltitude:false,egmConversion:false,qnhCorrection:false,historicTrackUtc:true,lastLegOnly:true,altitudeChart:true,infoblock:true,wideInfoblock:false,hoverInfoblock:false,autoSelect:false,picturesPlanespotters:true,picturesPlanespotting:false,groundVehicles:true,nonIcao:true,updateGps:true,includeFiltersUrl:false,keepFaded:false,debugTracks:false,debugShowAll:false,metric:false};
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const finite=v=>typeof v==='number'&&Number.isFinite(v), norm=v=>String(v||'').trim().toLowerCase();
  const tr=(key,fallback)=>settings.strings&&settings.strings[key]||fallback||key;
  function applyTranslations(){document.documentElement.dir=settings.rtl?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n,x.textContent));document.querySelectorAll('[data-i18n-placeholder]').forEach(x=>x.placeholder=tr(x.dataset.i18nPlaceholder,x.placeholder));document.querySelectorAll('[data-i18n-title]').forEach(x=>{x.title=tr(x.dataset.i18nTitle,x.title);x.setAttribute('aria-label',x.title)});document.querySelectorAll('[data-option-key]').forEach(x=>x.textContent=tr(x.dataset.optionKey,x.textContent))}
  function openSheet(id){closePanels();document.getElementById(id).classList.add('open')}
  function closePanels(){document.querySelectorAll('.sheet,.filters').forEach(x=>x.classList.remove('open'))}
  function toggleSearch(){document.getElementById('search').classList.toggle('open');document.getElementById('searchText').focus()}
  function openFilters(){closePanels();document.getElementById('filters').classList.add('open')}
  function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
  function resetView(){if(finite(own[0]))map.setView(own,10)}
  function locateMe(){if(finite(own[0]))map.flyTo(own,Math.max(map.getZoom(),12),{duration:.65})}
  function clearTracks(){history.clear();render()}
  function toggleFlag(k,row){flags[k]=!flags[k];row.classList.toggle('selected',flags[k]);if(k==='follow')followSelected()}
  function toggleFilterMilitary(row){flags.militaryOnly=!flags.militaryOnly;row.classList.toggle('selected',flags.militaryOnly);render()}
  function selectFirstMatch(){const match=visibleAircraft()[0];if(match){selectAircraft(match.hex);map.setView([match.lat,match.lon],Math.max(map.getZoom(),10))}}
  function altitude(a){if(a.on_ground)return 0;if(settings.geometricAltitude){if(settings.egmConversion&&finite(a.geometric_msl_altitude_ft))return a.geometric_msl_altitude_ft;if(finite(a.geometric_altitude_ft))return a.geometric_altitude_ft}let value=finite(a.barometric_altitude_ft)?a.barometric_altitude_ft:a.altitude_ft;if(settings.qnhCorrection&&finite(value)&&finite(a.qnh_hpa))value+=(a.qnh_hpa-1013.25)*27;return value}
  function altitudeText(a){if(a.on_ground)return tr('ground','Ground');const ft=altitude(a);if(!finite(ft))return tr('altitude_na','Altitude n/a');return settings.metric?Math.round(ft*.3048)+' m':Math.round(ft)+' ft'}
  function distanceText(a){return settings.metric?(a.distance_km||0).toFixed(1)+' km':((a.distance_km||0)/1.852).toFixed(1)+' NM'}
  function planeColor(a){if(a.on_ground||isGroundVehicle(a))return'#555d66';if(!settings.coloredPlanes)return a.military?'#ff9f43':'#41a7ff';const ft=altitude(a);if(!finite(ft))return'#aeb6bd';if(ft<0)return'#555d66';const stops=[[0,18],[2000,32],[6000,54],[9000,85],[11000,140],[40000,300],[51000,360]];let hue=stops[0][1];for(let i=0;i<stops.length-1;i++){const lo=stops[i],hi=stops[i+1];if(ft>=hi[0]){hue=hi[1];continue}if(ft>=lo[0])hue=lo[1]+(hi[1]-lo[1])*(ft-lo[0])/(hi[0]-lo[0]);break}const light=hue<60?52:hue<190?43:hue<290?56:48;return'hsl('+Math.round(hue)+',88%,'+light+'%)'}
  function isGroundVehicle(a){return /^C/.test(a.category||'')||/nt|ground/.test(a.data_source||'')}
  function matches(a){if(settings.debugShowAll)return true;if(!settings.groundVehicles&&isGroundVehicle(a))return false;if(!settings.nonIcao&&a.non_icao)return false;if(flags.militaryOnly&&!a.military)return false;if(flags.isolate&&selected.size&&!selected.has(a.hex))return false;const q=norm(document.getElementById('searchText').value);if(q&&!norm([a.display_name,a.callsign,a.registration,a.hex,a.type,a.description].join(' ')).includes(q))return false;
    const pairs=[['fType',a.type],['fDesc',a.description],['fHex',a.hex],['fReg',a.registration],['fCountry',a.registration],['fCategory',a.category]];for(const p of pairs){const el=document.getElementById(p[0]),v=el?norm(el.value):'';if(v&&!norm(p[1]).includes(v))return false}
    if(filters.sources.size&&!filters.sources.has(sourceGroup(a)))return false;if(filters.db.size){if(filters.db.has('military')&&!a.military)return false;if(filters.db.has('pia')&&!(a.db_flags&4))return false;if(filters.db.has('ladd')&&!(a.db_flags&8))return false}return true}
  function sourceGroup(a){const s=norm(a.data_source).replace(/-/g,'_');if(s.includes('adsr')||s.includes('uat'))return'adsr';if(s.includes('tisb'))return'tisb';if(s.includes('mlat'))return'mlat';if(s.includes('adsc'))return'adsc';if(s.includes('mode_s')||s==='modes')return'mode_s';if(s.includes('adsb'))return'adsb';return'other'}

  function filterState(){const state={};['fType','fDesc','fHex','fReg','fCountry','fCategory'].forEach(id=>{const v=document.getElementById(id).value;if(v)state[id]=v});if(filters.sources.size)state.sources=[...filters.sources];if(filters.db.size)state.db=[...filters.db];return state}
  function syncFilterUrl(){if(!settings.includeFiltersUrl){if(location.hash.startsWith('#filters='))window.history.replaceState(null,'',location.pathname);return}const state=filterState(),value=Object.keys(state).length?'#filters='+encodeURIComponent(JSON.stringify(state)):'';window.history.replaceState(null,'',location.pathname+value)}
  function restoreFiltersFromUrl(){if(filtersRestored||!settings.includeFiltersUrl)return;filtersRestored=true;if(!location.hash.startsWith('#filters='))return;try{const state=JSON.parse(decodeURIComponent(location.hash.slice(9)));['fType','fDesc','fHex','fReg','fCountry','fCategory'].forEach(id=>{if(state[id])document.getElementById(id).value=state[id]});filters.sources=new Set(state.sources||[]);filters.db=new Set(state.db||[]);document.querySelectorAll('#sourceChips .chip,#flagChips .chip').forEach(x=>x.classList.toggle('active',filters.sources.has(x.dataset.v)||filters.db.has(x.dataset.v)))}catch(e){}}
  function applyFilters(){filters.sources=new Set([...document.querySelectorAll('#sourceChips .active')].map(x=>x.dataset.v));filters.db=new Set([...document.querySelectorAll('#flagChips .active')].map(x=>x.dataset.v));syncFilterUrl();closePanels();render()}
  function clearFilters(){document.querySelectorAll('.filters input').forEach(x=>x.value='');document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));filters={sources:new Set(),db:new Set()};syncFilterUrl();render()}
  function chip(container,label,value,extra,labelKey){const b=document.createElement('button');b.className='chip '+(extra||'');b.textContent=label;b.dataset.v=value;if(labelKey)b.dataset.i18n=labelKey;b.onclick=()=>b.classList.toggle('active');container.appendChild(b)}
  [['ADS-B','adsb'],['UAT / ADS-R','adsr'],['MLAT','mlat'],['TIS-B','tisb'],['Mode-S','mode_s'],['ADS-C','adsc'],['Other','other']].forEach(x=>chip(document.getElementById('sourceChips'),x[0],x[1]));[['Military','military','military','military'],['PIA','pia','',''],['LADD','ladd','','']].forEach(x=>chip(document.getElementById('flagChips'),x[0],x[1],x[2],x[3]));
  function applyAppearance(){document.documentElement.style.setProperty('--scale',settings.textScale||1);document.body.classList.toggle('dark',!!settings.dark);document.body.classList.toggle('darker',!!settings.darker);document.body.classList.toggle('dim',!!settings.dim)}
  window.marResize=function(){map.invalidateSize({pan:false,animate:false});scheduleCanvas();setTimeout(()=>{map.invalidateSize({pan:false,animate:false});scheduleCanvas()},60);setTimeout(()=>{map.invalidateSize({pan:false,animate:false});scheduleCanvas()},240)};
  window.marUpdate=function(raw,ownLat,ownLon,_radiusKm,nativeSettings){window.marResize();if(!Object.keys(settings).length)settings={...defaults,...nativeSettings};else Object.keys(nativeSettings).forEach(k=>{if(!sessionOverrides.has(k))settings[k]=nativeSettings[k]});own=[ownLat,ownLon];if(settings.updateGps&&finite(ownLat)&&finite(ownLon)&&!centered){resetView();centered=true}let next=[];if(!trafficTooWide())try{next=JSON.parse(raw)||[]}catch(e){}aircraft=next;next.forEach(a=>known.set(a.hex,a));if(next.length)updateHistory(next);restoreFiltersFromUrl();syncFilterUrl();applyTranslations();ownLayer.clearLayers();if(settings.updateGps&&finite(ownLat)&&finite(ownLon)){const icon=L.divIcon({className:'own-dot',iconSize:[18,18],iconAnchor:[9,9]});L.marker(own,{icon}).bindTooltip(tr('your_position','Your position')).addTo(ownLayer)}const infoOpen=document.getElementById('info').classList.contains('open');render();applyPendingFocus();if(infoOpen&&selected.size&&!trafficTooWide())showInfo([...selected].pop())};
  let viewportTimer=0;function reportViewport(){clearTimeout(viewportTimer);viewportTimer=setTimeout(()=>{if(trafficTooWide()||!window.MarNative||!MarNative.setMapViewport)return;const center=map.getCenter();MarNative.setMapViewport(center.lat,center.lng,requestedViewportRadiusNm())},180)}
  map.on('move zoom resize',scheduleCanvas);map.on('moveend zoomend',()=>{scheduleCanvas();reportViewport()});window.addEventListener('resize',()=>{window.marResize();reportViewport()});
  applyAppearance();window.marResize();
</script>
