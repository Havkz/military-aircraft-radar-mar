name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag receiving the unsigned IPA
        required: true
        default: v1.2.50

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device application
        working-directory: ios
        run: |
          xcodebuild \
            -project MAR.xcodeproj \
            -scheme MAR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: ios
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/MAR.app
          cd package
          zip -qry "MAR-iOS-Unsigned-${VERSION}.ipa" Payload
          shasum -a 256 "MAR-iOS-Unsigned-${VERSION}.ipa" > "MAR-iOS-Unsigned-${VERSION}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAR-iOS-Unsigned-${{ inputs.release_tag }}
          path: ios/package/MAR-iOS-Unsigned-*

      - name: Attach IPA to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" ios/package/MAR-iOS-Unsigned-* \
            --repo '${{ github.repository }}' --clobber
